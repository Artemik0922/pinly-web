name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Типы и линт
        run: |
          npm run typecheck
          npx eslint src
      - name: Продакшн-сборка
        run: npm run build
        env:
          # сборка не ходит в сеть, но пусть метаданные будут корректными
          NEXT_PUBLIC_SITE_URL: https://example.invalid

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Зависимости
        run: pip install -r backend/requirements-dev.txt
      - name: pytest
        working-directory: .
        run: python -m pytest backend/tests -q

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: pip install -r backend/requirements.txt
      - name: Браузер для Playwright
        run: npx playwright install --with-deps chromium
      - name: Бэкенд в фоне
        env:
          PINLY_DATA_DIR: ${{ runner.temp }}/pinly-data
          PINLY_JWT_SECRET: ci-secret-should-be-long-enough-0123456789
        run: |
          mkdir -p "$PINLY_DATA_DIR"
          nohup python -m uvicorn backend.app:app --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break || sleep 1
          done
      - name: Смоук в браузере
        run: npm run test:e2e
      - name: Лог бэкенда при падении
        if: failure()
        run: cat backend.log
      - name: Скриншоты и трейсы при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
